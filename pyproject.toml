description = "Telegram bot for selling WoT / WoT Blitz accounts"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.13.1",
    "aiosqlite==0.20.0",
    "python-dotenv==1.0.1",
    "aiohttp-socks==0.9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
